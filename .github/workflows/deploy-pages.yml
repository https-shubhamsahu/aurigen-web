name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          # Empty for apex custom domain https://aurigen.tech
          # (project URL https://…github.io/aurigen-web/ needs /aurigen-web instead)
          PAGES_BASE_PATH: ""
          # Optional; empty falls through to WORKSHOP_RUNTIME_GAS_URL_DEFAULT
          NEXT_PUBLIC_WORKSHOP_RUNTIME_GAS_URL: ${{ secrets.NEXT_PUBLIC_WORKSHOP_RUNTIME_GAS_URL }}
          NEXT_PUBLIC_BUILDLAB_GAS_URL: ${{ secrets.NEXT_PUBLIC_BUILDLAB_GAS_URL }}
          NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ secrets.NEXT_PUBLIC_WHATSAPP_NUMBER }}
          NEXT_PUBLIC_VLOG_GAS_URL: ${{ secrets.NEXT_PUBLIC_VLOG_GAS_URL }}
          NEXT_PUBLIC_CHALLENGE_GAS_URL: ${{ secrets.NEXT_PUBLIC_CHALLENGE_GAS_URL }}
          NEXT_PUBLIC_GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_DRIVE_CLIENT_ID }}
          NEXT_PUBLIC_GOOGLE_DRIVE_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_DRIVE_API_KEY }}
          NEXT_PUBLIC_GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_DRIVE_FOLDER_ID }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
